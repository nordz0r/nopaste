---
services:
  nopaste-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_VERSION: ${APP_VERSION:-}
    image: nopaste:local
    container_name: nopaste-local
    ports:
      - "${APP_PORT:-8000}:8000"
    # network_mode: host   # Disabled for better cross-platform support (Windows + WSL2).
    # With ports mapping, http://localhost:8000 works from Windows, WSL and native Linux.
    # If you specifically need host networking on Linux, uncomment it and remove the ports section.
    environment:
      DATABASE_PATH: /tmp/pastes.db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: test-runtime
      args:
        APP_VERSION: ${APP_VERSION:-}
    image: nopaste:test
    container_name: nopaste-test
    environment:
      DATABASE_PATH: ":memory:"
