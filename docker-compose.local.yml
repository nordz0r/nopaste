---
# Local build stack. Same env model as docker-compose.yml.
#   docker compose -f docker-compose.local.yml up --build -d
#   docker compose -f docker-compose.local.yml --profile test run --rm tests
#   DATABASE_URL=postgresql+psycopg://nopaste:nopaste@postgres:5432/nopaste \
#     docker compose -f docker-compose.local.yml --profile postgres up --build -d
services:
  nopaste-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_VERSION: ${APP_VERSION:-}
        UV_VERSION: ${UV_VERSION:-0.12.2}
    image: nopaste:local
    container_name: nopaste-local
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/tmp/pastes.db}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      PASTE_ENCRYPTION_KEY: ${PASTE_ENCRYPTION_KEY:-}
      COOKIE_SIGNING_SECRET: ${COOKIE_SIGNING_SECRET:-local-development-cookie-secret}
      SHRINK_URL: ${SHRINK_URL:-}
      SHRINK_TOKEN: ${SHRINK_TOKEN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      UI_DESIGN: ${UI_DESIGN:-default}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    container_name: nopaste-postgres-local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nopaste}
      POSTGRES_USER: ${POSTGRES_USER:-nopaste}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nopaste}
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - nopaste_pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: test-runtime
      args:
        APP_VERSION: ${APP_VERSION:-}
        UV_VERSION: ${UV_VERSION:-0.12.2}
    image: nopaste:test
    container_name: nopaste-test
    environment:
      DATABASE_PATH: ":memory:"
    command: ["pytest", "-q"]

volumes:
  nopaste_pgdata_local:
