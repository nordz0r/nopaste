<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="fav-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3238"/>
      <stop offset="100%" stop-color="#0F1113"/>
    </linearGradient>
  </defs>

  <g id="favicon-head-mark">
    <!-- Circular Shield Background for crisp visibility in all tabs -->
    <circle cx="32" cy="32" r="30" fill="#181B1F"/>
    
    <!-- White Cheek Surround -->
    <circle cx="30" cy="32" r="18" fill="#FFFFFF"/>

    <!-- Black Cap & Neck -->
    <path d="M 18 20 C 26 12, 42 12, 46 22 C 48 30, 42 42, 34 42 C 26 42, 18 32, 18 20 Z" fill="url(#fav-dark)"/>

    <!-- Crimson Red Mask -->
    <path d="M 14 26 C 18 18, 30 18, 34 26 C 36 32, 30 38, 22 38 C 16 38, 12 32, 14 26 Z" fill="url(#fav-red)"/>

    <!-- Gold Accent Slash -->
    <path d="M 38 32 C 44 32, 48 38, 44 48 C 40 48, 36 42, 38 32 Z" fill="url(#fav-gold)"/>

    <!-- Ivory Beak -->
    <path d="M 16 28 L 4 31 L 17 35 Z" fill="#FFF8E7"/>

    <!-- Bright Eye -->
    <circle cx="23" cy="27" r="3.5" fill="#0F1113"/>
    <circle cx="24" cy="26" r="1" fill="#FFFFFF"/>
  </g>
</svg>
