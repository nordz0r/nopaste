<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium color gradients for depth & vibrant modern aesthetics -->
    <linearGradient id="gf-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="60%" stop-color="#E52C2C"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>

    <linearGradient id="gf-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="40%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <linearGradient id="gf-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3238"/>
      <stop offset="60%" stop-color="#1A1D20"/>
      <stop offset="100%" stop-color="#0F1113"/>
    </linearGradient>

    <linearGradient id="gf-tan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4C59E"/>
      <stop offset="70%" stop-color="#C89B67"/>
      <stop offset="100%" stop-color="#A47745"/>
    </linearGradient>

    <linearGradient id="gf-cream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F5F0EB"/>
      <stop offset="100%" stop-color="#EAE3D9"/>
    </linearGradient>

    <linearGradient id="gf-beak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="100%" stop-color="#E2D4BF"/>
    </linearGradient>

    <filter id="gf-drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Main Goldfinch Mark -->
  <g id="goldfinch-logo-mark" filter="url(#gf-drop-shadow)">
    <!-- Wooden Branch -->
    <path d="M 64 424 C 160 416, 280 432, 448 448 C 410 440, 270 420, 64 424 Z" fill="#6D4C41" opacity="0.85"/>
    <path d="M 80 422 C 180 410, 320 426, 440 442 C 320 430, 180 414, 80 422 Z" fill="#8D6E63"/>

    <!-- Bird Feet / Claws -->
    <path d="M 205 388 C 195 400, 192 414, 202 422 C 206 424, 214 416, 218 402 Z" fill="#A1887F"/>
    <path d="M 255 380 C 248 394, 245 410, 256 418 C 262 420, 270 408, 272 392 Z" fill="#8D6E63"/>

    <!-- Tail Feathers -->
    <path d="M 285 360 L 415 448 C 425 455, 435 450, 420 432 L 315 325 Z" fill="url(#gf-dark)"/>
    <path d="M 300 355 L 428 442 C 434 446, 438 440, 425 428 L 325 315 Z" fill="#0F1113"/>
    <path d="M 330 370 L 412 432" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

    <!-- Body & Back (Warm Tan) -->
    <path d="M 210 160 C 270 150, 330 200, 345 300 C 350 330, 335 365, 305 375 C 240 395, 180 340, 150 270 C 135 235, 160 175, 210 160 Z" fill="url(#gf-tan)"/>

    <!-- Breast / Belly (Clean Cream/White) -->
    <path d="M 175 220 C 160 250, 165 310, 210 365 C 245 385, 280 375, 295 355 C 265 355, 220 320, 200 270 C 190 245, 185 225, 175 220 Z" fill="url(#gf-cream)"/>

    <!-- Main Wing Structure (Dark Charcoal/Black) -->
    <path d="M 215 210 C 265 200, 335 240, 385 330 C 395 348, 385 362, 365 365 C 325 370, 265 330, 225 285 C 205 260, 205 230, 215 210 Z" fill="url(#gf-dark)"/>

    <!-- Iconic Golden Yellow Wing Bar -->
    <path d="M 235 225 C 275 220, 315 245, 355 300 C 335 305, 285 280, 250 255 C 238 245, 232 235, 235 225 Z" fill="url(#gf-gold)"/>
    <path d="M 248 248 C 280 245, 320 270, 352 318 C 342 322, 308 300, 270 275 Z" fill="#FFE082" opacity="0.6"/>

    <!-- White Feather Spots on Wing Edge -->
    <circle cx="365" cy="335" r="4" fill="#FFFFFF"/>
    <circle cx="350" cy="348" r="4" fill="#FFFFFF"/>
    <circle cx="335" cy="358" r="4" fill="#FFFFFF"/>

    <!-- Nape / Back of Neck (Black Hood) -->
    <path d="M 195 125 C 220 115, 255 130, 250 170 C 235 170, 205 160, 195 125 Z" fill="url(#gf-dark)"/>

    <!-- White Cheek & Collar Surround -->
    <path d="M 160 155 C 175 140, 205 140, 220 165 C 225 185, 210 210, 180 215 C 165 210, 150 180, 160 155 Z" fill="url(#gf-cream)"/>

    <!-- Black Head Cap -->
    <path d="M 155 130 C 170 100, 215 95, 235 120 C 245 135, 230 155, 215 155 C 190 155, 160 145, 155 130 Z" fill="url(#gf-dark)"/>

    <!-- Vibrant Crimson Red Mask -->
    <path d="M 105 150 C 115 125, 145 120, 165 135 C 175 145, 175 165, 160 180 C 140 190, 115 180, 105 150 Z" fill="url(#gf-red)"/>

    <!-- Ivory Beak -->
    <path d="M 115 148 L 60 158 C 52 160, 52 165, 62 170 L 118 178 Z" fill="url(#gf-beak)"/>
    <path d="M 115 148 L 60 158 C 55 159, 58 164, 117 163 Z" fill="#E4C59E"/>

    <!-- Expressive Eye -->
    <circle cx="145" cy="148" r="11" fill="#0F1113"/>
    <circle cx="145" cy="148" r="8" fill="#1C1E22"/>
    <circle cx="148" cy="145" r="3.5" fill="#FFFFFF"/>
    <circle cx="143" cy="151" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  </g>
</svg>
