<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ meta.title if meta else "Nopaste" }}</title>
    <meta name="description" content="{{ meta.description if meta else 'Share text, logs, notes, and configs with Nopaste.' }}">
    <meta name="theme-color" content="#0e1012">
    <link rel="canonical" href="{{ meta.url if meta else request.url }}">
    <link rel="icon" href="/static/images/favicon.png" type="image/png">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:site_name" content="{{ meta.site_name if meta else 'Nopaste' }}">
    <meta property="og:type" content="{{ meta.type if meta else 'website' }}">
    <meta property="og:title" content="{{ meta.title if meta else 'Nopaste' }}">
    <meta property="og:description" content="{{ meta.description if meta else 'Share text, logs, notes, and configs with Nopaste.' }}">
    <meta property="og:url" content="{{ meta.url if meta else request.url }}">
    <meta property="og:image" content="{{ meta.image_url if meta else request.url_for('static', path='images/goldfinches_logo.png') }}">
    <meta property="og:image:alt" content="{{ meta.image_alt if meta else 'Nopaste brand preview' }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ meta.title if meta else 'Nopaste' }}">
    <meta name="twitter:description" content="{{ meta.description if meta else 'Share text, logs, notes, and configs with Nopaste.' }}">
    <meta name="twitter:image" content="{{ meta.image_url if meta else request.url_for('static', path='images/goldfinches_logo.png') }}">
    <link rel="stylesheet" href="/static/css/style.css?v={{ asset_version }}">
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="header-brand">
                <a href="/" class="brand-lockup" aria-label="Nopaste home">
                    <span class="brand-mark" aria-hidden="true">
                        <img src="/static/images/goldfinches_logo.png" alt="Nopaste logo" class="brand-logo">
                    </span>
                    <span class="brand-wordmark">Nopaste</span>
                </a>
            </div>
            <div class="header-actions">
                <nav aria-label="Primary">
                    <a href="/list" class="btn btn-secondary" title="My Pastes">
                        <img src="/static/images/list.png" alt="" class="btn-icon-image btn-icon-image-list">
                        <span>My List</span>
                    </a>
                </nav>
            </div>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <div id="notification" class="notification"></div>
    <script>
    function showNotification(message) {
        const notification = document.getElementById("notification");
        if (!notification) return;
        notification.textContent = message;
        notification.style.display = "block";
        setTimeout(() => {
            notification.style.opacity = "0";
            setTimeout(() => {
                notification.style.display = "none";
                notification.style.opacity = "1";
            }, 300);
        }, 2000);
    }

    async function copyToClipboard(text, successMsg) {
        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(text);
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
            }
            showNotification(successMsg || "Скопировано!");
        } catch (err) {
            showNotification("Ошибка копирования");
        }
    }

    const copyBtn = document.getElementById("copy-btn");
    if (copyBtn) {
        const copyTarget = {% if short_url %}"{{ short_url }}"{% else %}window.location.href{% endif %};
        copyBtn.addEventListener("click", () => copyToClipboard(copyTarget, "Ссылка скопирована!"));
    }
    </script>
</body>
</html>
