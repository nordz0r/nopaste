<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" href="/static/images/favicon.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nopaste{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="header-brand">
                <a href="/" class="brand-lockup" aria-label="Nopaste home">
                    <img src="/static/images/goldfinches_logo.png" alt="Goldfinch logo" class="brand-logo">
                    <span class="brand-wordmark">Nopaste</span>
                </a>
                {% if paste_id %}
                <button id="copy-btn" class="btn btn-secondary" title="Скопировать ссылку">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    <span>Copy Link</span>
                </button>
                {% endif %}
            </div>
            <div class="header-actions">
                <nav aria-label="Primary">
                    <a href="/list" class="btn btn-secondary" title="My Pastes">
                        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
                        <span>My List</span>
                    </a>
                </nav>
            </div>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <div id="notification" class="notification"></div>
    <script>
    function showNotification(message) {
        const notification = document.getElementById("notification");
        if (!notification) return;
        notification.textContent = message;
        notification.style.display = "block";
        setTimeout(() => {
            notification.style.opacity = "0";
            setTimeout(() => {
                notification.style.display = "none";
                notification.style.opacity = "1";
            }, 300);
        }, 2000);
    }

    async function copyToClipboard(text, successMsg) {
        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(text);
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
            }
            showNotification(successMsg || "Скопировано!");
        } catch (err) {
            showNotification("Ошибка копирования");
        }
    }

    const copyBtn = document.getElementById("copy-btn");
    if (copyBtn) {
        const copyTarget = {% if short_url %}"{{ short_url }}"{% else %}window.location.href{% endif %};
        copyBtn.addEventListener("click", () => copyToClipboard(copyTarget, "Ссылка скопирована!"));
    }
    </script>
</body>
</html>
