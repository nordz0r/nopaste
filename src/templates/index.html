{% extends base_template %}

{% block content %}
<div class="editor-card">
    <div class="editor-card-header">
        <h2>Create a new paste</h2>
        <p>Your paste will be saved and linked to this browser's history.</p>
    </div>
    <div class="form-container">
        <form action="/paste" method="post" id="nopaste-form">
            <label class="sr-only" for="paste-content-input">Paste content</label>
            <textarea id="paste-content-input" name="content" rows="14" placeholder="Paste your text, logs, notes, or config here..." autofocus></textarea>
            <div class="custom-slug-field">
                <label for="custom-slug-input">Имя короткой ссылки <span>(необязательно)</span></label>
                <div class="custom-slug-input-wrap">
                    <span aria-hidden="true">/</span>
                    <input
                        id="custom-slug-input"
                        name="custom_slug"
                        type="text"
                        maxlength="64"
                        pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,63}"
                        autocomplete="off"
                        placeholder="my-note"
                    >
                </div>
                <small>Латинские буквы, цифры, <code>-</code> и <code>_</code>.</small>
            </div>
            <div class="form-actions">
                <span class="form-hint">Ctrl + Enter to save</span>
                <button type="submit" class="btn btn-primary">
                    <span class="icon-badge icon-badge-plain" aria-hidden="true">
                        <img src="/static/images/save.png" alt="" class="btn-icon-image btn-icon-image-save">
                    </span>
                    <span>Save Paste</span>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
const nopasteForm = document.getElementById("nopaste-form");
const textarea = document.getElementById("paste-content-input");

nopasteForm.addEventListener("submit", function(event) {
    if (!textarea.value.trim()) {
        event.preventDefault();
        showNotification("Нельзя сохранить пустой nopaste!");
    }
});

textarea.addEventListener("keydown", function(event) {
    if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        event.preventDefault();
        nopasteForm.requestSubmit();
    }
});
</script>
{% endblock %}
