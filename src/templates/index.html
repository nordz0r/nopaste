{% extends "base.html" %}

{% block title %}Create Nopaste{% endblock %}

{% block content %}
<div class="editor-card">
    <div class="editor-card-header">
        <h2>Новая паста</h2>
    </div>
    <form action="/paste" method="post" id="nopaste-form">
        <label class="sr-only" for="paste-content-input">Paste content</label>
        <textarea id="paste-content-input" name="content" rows="18" placeholder="Введите ваш текст здесь..."></textarea>
        <div class="form-actions">
            <input type="submit" value="Создать">
        </div>
    </form>
</div>

<script>
document.getElementById("nopaste-form").addEventListener("submit", function(event) {
    const textarea = document.getElementById("paste-content-input");
    if (!textarea.value.trim()) {
        event.preventDefault();
        showNotification("Контент не может быть пустым!");
    }
});
</script>
{% endblock %}
