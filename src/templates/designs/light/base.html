<!DOCTYPE html>
<html lang="{{ lang|default('ru') }}" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{{ meta.title if meta else "Nopaste" }}</title>
    <meta name="description" content="{{ meta.description if meta else 'Share text, logs, notes, and configs with Nopaste.' }}">
    <meta name="theme-color" content="#e9e2d8">
    <link rel="canonical" href="{{ meta.url if meta else request.url }}">
    <link rel="icon" href="/static/images/favicon.png" type="image/png">
    <meta property="og:locale" content="{{ 'en_US' if lang|default('ru') == 'en' else 'ru_RU' }}">
    <meta property="og:site_name" content="{{ meta.site_name if meta else 'Nopaste' }}">
    <meta property="og:type" content="{{ meta.type if meta else 'website' }}">
    <meta property="og:title" content="{{ meta.title if meta else 'Nopaste' }}">
    <meta property="og:description" content="{{ meta.description if meta else 'Share text, logs, notes, and configs with Nopaste.' }}">
    <meta property="og:url" content="{{ meta.url if meta else request.url }}">
    <meta property="og:image" content="{{ meta.image_url if meta else request.url_for('static', path='images/goldfinches_logo.png') }}">
    <meta property="og:image:alt" content="{{ meta.image_alt if meta else 'Nopaste brand preview' }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ meta.title if meta else 'Nopaste' }}">
    <meta name="twitter:description" content="{{ meta.description if meta else 'Share text, logs, notes, and configs with Nopaste.' }}">
    <meta name="twitter:image" content="{{ meta.image_url if meta else request.url_for('static', path='images/goldfinches_logo.png') }}">
    <link rel="stylesheet" href="/static/css/style.css?v={{ asset_version }}">
    <script>
        (function() {
            const savedTheme = localStorage.getItem("nopaste-theme");
            const theme = savedTheme ? savedTheme : "light";
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="header-brand">
                <a href="/" class="brand-lockup" aria-label="Nopaste home">
                    <span class="brand-mark" aria-hidden="true">
                        <img src="/static/images/goldfinches_logo.png" alt="Nopaste logo" class="brand-logo">
                    </span>
                    <span class="brand-wordmark">Nopaste</span>
                </a>
            </div>
            <div class="header-actions">
                <button type="button" id="theme-toggle-btn" class="btn btn-secondary theme-toggle-btn" title="{{ t('nav.theme') if t is defined else 'Toggle theme' }}" aria-label="{{ t('nav.theme') if t is defined else 'Toggle theme' }}">
                    <svg class="icon-svg theme-icon-sun" viewBox="0 0 24 24" style="width:16px;height:16px;"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
                    <svg class="icon-svg theme-icon-moon" viewBox="0 0 24 24" style="width:16px;height:16px;display:none;"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
                </button>
                <nav aria-label="Primary">
                    <a href="/list" class="btn btn-secondary" title="{{ t('nav.my_list') if t is defined else 'My List' }}">
                        <img src="/static/images/list.png" alt="" class="btn-icon-image btn-icon-image-list">
                        <span>{{ t('nav.my_list') if t is defined else 'My List' }}</span>
                    </a>
                </nav>
            </div>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="site-footer-container">
            <p class="site-footer-text">© {{ current_year() }} <a href="https://cv.goldfinches.ru">NorD</a> · Nopaste v{{ app_version }} · <button type="button" class="link-btn" id="open-changelog-btn" data-changelog-open>{{ t('footer.changelog') if t is defined else 'Changelog' }}</button></p>
        </div>
    </footer>

    <div
        id="changelog-modal"
        class="modal-backdrop"
        role="dialog"
        aria-modal="true"
        aria-labelledby="changelog-modal-title"
        hidden
    >
        <div class="modal-dialog" role="document">
            <div class="modal-header">
                <h2 id="changelog-modal-title">{{ t('changelog.title') if t is defined else 'Nopaste Changelog' }}</h2>
                <button type="button" class="modal-close" id="changelog-modal-close" aria-label="{{ t('changelog.close') if t is defined else 'Close' }}">×</button>
            </div>
            <div class="modal-body">
                <p id="changelog-modal-status" class="modal-status">{{ t('changelog.loading') if t is defined else 'Loading…' }}</p>
                <div id="changelog-modal-markdown" class="markdown-body" hidden></div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>
    <script src="/static/js/marked.min.js?v={{ asset_version }}"></script>
    <script>
    const footer = document.querySelector('.site-footer');
    if (footer) {
        const BOTTOM_THRESHOLD_PX = 24;
        function updateFooterVisibility() {
            const doc = document.documentElement;
            const scrollable = doc.scrollHeight > window.innerHeight + 4;
            if (!scrollable) {
                footer.classList.remove("is-hidden");
                return;
            }
            const atTop = window.scrollY <= 2;
            const atBottom = (window.innerHeight + window.scrollY) >= (doc.scrollHeight - BOTTOM_THRESHOLD_PX);
            if (atTop || atBottom) {
                footer.classList.remove("is-hidden");
            } else {
                footer.classList.add("is-hidden");
            }
        }
        window.addEventListener("scroll", updateFooterVisibility, { passive: true });
        window.addEventListener("resize", updateFooterVisibility, { passive: true });
        updateFooterVisibility();
    }

    const header = document.querySelector('.site-header');
    if (header) {
        let lastScrollY = window.scrollY;
        const HIDE_THRESHOLD = 180;
        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;
            if (currentScrollY > HIDE_THRESHOLD && currentScrollY > lastScrollY) {
                header.classList.add('is-hidden');
            } else if (currentScrollY < lastScrollY || currentScrollY <= HIDE_THRESHOLD) {
                header.classList.remove('is-hidden');
            }
            lastScrollY = currentScrollY;
        }, { passive: true });
    }

    function showNotification(message) {
        const notification = document.getElementById("notification");
        if (!notification) return;
        notification.textContent = message;
        notification.style.display = "block";
        setTimeout(() => {
            notification.style.opacity = "0";
            setTimeout(() => {
                notification.style.display = "none";
                notification.style.opacity = "1";
            }, 300);
        }, 2000);
    }

    const i18nBase = {{ (i18n_js if i18n_js is defined else {})|tojson }};

    async function copyToClipboard(text, successMsg) {
        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(text);
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
            }
            showNotification(successMsg || i18nBase["toast.copied"] || "Copied!");
        } catch (err) {
            showNotification(i18nBase["toast.copy_error"] || "Copy failed");
        }
    }

    function flashPress(btn) {
        if (!btn) return;
        btn.classList.add("is-pressed");
        window.setTimeout(() => btn.classList.remove("is-pressed"), 180);
    }

    const copyBtn = document.getElementById("copy-btn");
    if (copyBtn) {
        copyBtn.addEventListener("click", () => {
            flashPress(copyBtn);
            const target = (typeof shareUrl !== "undefined" && shareUrl)
                ? shareUrl
                : ({% if short_url %}{{ short_url|tojson }}{% else %}window.location.href{% endif %});
            copyToClipboard(target, i18nBase["toast.link_copied"] || "Link copied!");
        });
    }

    const copyContentBtnBase = document.getElementById("copy-content-btn");
    if (copyContentBtnBase) {
        copyContentBtnBase.addEventListener("click", () => flashPress(copyContentBtnBase));
    }

    const themeToggleBtn = document.getElementById("theme-toggle-btn");
    if (themeToggleBtn) {
        const sunIcon = themeToggleBtn.querySelector(".theme-icon-sun");
        const moonIcon = themeToggleBtn.querySelector(".theme-icon-moon");

        function updateToggleIcons(currentTheme) {
            if (currentTheme === "light") {
                if (sunIcon) sunIcon.style.display = "none";
                if (moonIcon) moonIcon.style.display = "inline-block";
                themeToggleBtn.setAttribute("title", "Переключить на темную тему");
            } else {
                if (sunIcon) sunIcon.style.display = "inline-block";
                if (moonIcon) moonIcon.style.display = "none";
                themeToggleBtn.setAttribute("title", "Переключить на светлую тему");
            }
        }

        const currentTheme = document.documentElement.getAttribute("data-theme") || "light";
        updateToggleIcons(currentTheme);

        themeToggleBtn.addEventListener("click", () => {
            const activeTheme = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", activeTheme);
            localStorage.setItem("nopaste-theme", activeTheme);
            updateToggleIcons(activeTheme);
        });
    }

    // Changelog modal (footer + /#changelog + permanent /nopaste_changelog redirect)
    (function initChangelogModal() {
        const modal = document.getElementById("changelog-modal");
        const openBtn = document.getElementById("open-changelog-btn");
        const closeBtn = document.getElementById("changelog-modal-close");
        const statusEl = document.getElementById("changelog-modal-status");
        const mdEl = document.getElementById("changelog-modal-markdown");
        if (!modal) return;

        let loaded = false;
        let loading = false;
        const msgLoading = {{ (t('changelog.loading') if t is defined else 'Loading…')|tojson }};
        const msgError = {{ (t('changelog.load_error') if t is defined else 'Could not load changelog')|tojson }};

        async function ensureLoaded() {
            if (loaded || loading) return;
            loading = true;
            if (statusEl) {
                statusEl.hidden = false;
                statusEl.textContent = msgLoading;
            }
            if (mdEl) mdEl.hidden = true;
            try {
                const res = await fetch("/api/changelog", { headers: { Accept: "text/markdown, text/plain" } });
                if (!res.ok) throw new Error("bad status");
                const text = await res.text();
                if (mdEl && window.marked) {
                    marked.setOptions({ gfm: true, breaks: false });
                    mdEl.innerHTML = marked.parse(text);
                    mdEl.hidden = false;
                    if (statusEl) statusEl.hidden = true;
                } else if (mdEl) {
                    mdEl.textContent = text;
                    mdEl.hidden = false;
                    if (statusEl) statusEl.hidden = true;
                }
                loaded = true;
            } catch (err) {
                if (statusEl) {
                    statusEl.hidden = false;
                    statusEl.textContent = msgError;
                }
            } finally {
                loading = false;
            }
        }

        function openModal() {
            modal.hidden = false;
            void modal.offsetWidth;
            modal.classList.add("is-open");
            document.body.classList.add("modal-open");
            ensureLoaded();
            if (closeBtn) closeBtn.focus();
        }

        function closeModal() {
            modal.classList.remove("is-open");
            document.body.classList.remove("modal-open");
            window.setTimeout(() => {
                if (!modal.classList.contains("is-open")) modal.hidden = true;
            }, 160);
            if (window.location.hash === "#changelog") {
                history.replaceState(null, "", window.location.pathname + window.location.search);
            }
        }

        if (openBtn) {
            openBtn.addEventListener("click", (e) => {
                e.preventDefault();
                openModal();
            });
        }
        if (closeBtn) closeBtn.addEventListener("click", closeModal);

        modal.addEventListener("click", (e) => {
            if (e.target === modal) closeModal();
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && modal.classList.contains("is-open")) {
                e.preventDefault();
                closeModal();
            }
        });

        function maybeOpenFromHash() {
            if (window.location.hash === "#changelog") openModal();
        }
        window.addEventListener("hashchange", maybeOpenFromHash);
        maybeOpenFromHash();
    })();
    </script>
</body>
</html>
