<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ meta.title if meta else "Nopaste" }}</title>
    <meta name="description" content="{{ meta.description if meta else 'Share text, logs, notes, and configs with Nopaste.' }}">
    <meta name="theme-color" content="#f8fafc">
    <link rel="canonical" href="{{ meta.url if meta else request.url }}">
    <link rel="icon" href="/static/images/favicon.png" type="image/png">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:site_name" content="{{ meta.site_name if meta else 'Nopaste' }}">
    <meta property="og:type" content="{{ meta.type if meta else 'website' }}">
    <meta property="og:title" content="{{ meta.title if meta else 'Nopaste' }}">
    <meta property="og:description" content="{{ meta.description if meta else 'Share text, logs, notes, and configs with Nopaste.' }}">
    <meta property="og:url" content="{{ meta.url if meta else request.url }}">
    <meta property="og:image" content="{{ meta.image_url if meta else request.url_for('static', path='images/goldfinches_logo.png') }}">
    <meta property="og:image:alt" content="{{ meta.image_alt if meta else 'Nopaste brand preview' }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ meta.title if meta else 'Nopaste' }}">
    <meta name="twitter:description" content="{{ meta.description if meta else 'Share text, logs, notes, and configs with Nopaste.' }}">
    <meta name="twitter:image" content="{{ meta.image_url if meta else request.url_for('static', path='images/goldfinches_logo.png') }}">
    <link rel="stylesheet" href="/static/css/style.css?v={{ asset_version }}">
    <script>
        (function() {
            const savedTheme = localStorage.getItem("nopaste-theme");
            const theme = savedTheme ? savedTheme : "light";
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="header-brand">
                <a href="/" class="brand-lockup" aria-label="Nopaste home">
                    <span class="brand-mark" aria-hidden="true">
                        <img src="/static/images/goldfinches_logo.png" alt="Nopaste logo" class="brand-logo">
                    </span>
                    <span class="brand-wordmark">Nopaste</span>
                </a>
            </div>
            <div class="header-actions">
                <button type="button" id="theme-toggle-btn" class="btn btn-secondary theme-toggle-btn" title="Переключить тему" aria-label="Переключить тему">
                    <svg class="icon-svg theme-icon-sun" viewBox="0 0 24 24" style="width:16px;height:16px;"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
                    <svg class="icon-svg theme-icon-moon" viewBox="0 0 24 24" style="width:16px;height:16px;display:none;"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
                </button>
                <nav aria-label="Primary">
                    <a href="/list" class="btn btn-secondary" title="My Pastes">
                        <img src="/static/images/list.png" alt="" class="btn-icon-image btn-icon-image-list">
                        <span>My List</span>
                    </a>
                </nav>
            </div>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="site-footer-container">
            <p class="site-footer-text">© {{ current_year() }} <a href="https://cv.goldfinches.ru">NorD</a> · Nopaste v{{ app_version }}</p>
        </div>
    </footer>
    <div id="notification" class="notification"></div>
    <script>
    const footer = document.querySelector('.site-footer');
    if (footer) {
        let scrollTimeout;
        let isHoveringFooter = false;
        
        footer.addEventListener('mouseenter', () => isHoveringFooter = true);
        footer.addEventListener('mouseleave', () => {
            isHoveringFooter = false;
            setTimeout(() => { if(!isHoveringFooter) footer.classList.remove('is-visible'); }, 500);
        });
        
        const showFooter = () => {
            footer.classList.add('is-visible');
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                if (!isHoveringFooter) {
                    footer.classList.remove('is-visible');
                }
            }, 2000);
        };
        
        window.addEventListener('scroll', showFooter, { passive: true });
        
        // Show initially
        showFooter();
    }

    function showNotification(message) {
        const notification = document.getElementById("notification");
        if (!notification) return;
        notification.textContent = message;
        notification.style.display = "block";
        setTimeout(() => {
            notification.style.opacity = "0";
            setTimeout(() => {
                notification.style.display = "none";
                notification.style.opacity = "1";
            }, 300);
        }, 2000);
    }

    async function copyToClipboard(text, successMsg) {
        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(text);
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
            }
            showNotification(successMsg || "Скопировано!");
        } catch (err) {
            showNotification("Ошибка копирования");
        }
    }

    const copyBtn = document.getElementById("copy-btn");
    if (copyBtn) {
        const copyTarget = {% if short_url %}"{{ short_url }}"{% else %}window.location.href{% endif %};
        copyBtn.addEventListener("click", () => copyToClipboard(copyTarget, "Ссылка скопирована!"));
    }

    const themeToggleBtn = document.getElementById("theme-toggle-btn");
    if (themeToggleBtn) {
        const sunIcon = themeToggleBtn.querySelector(".theme-icon-sun");
        const moonIcon = themeToggleBtn.querySelector(".theme-icon-moon");

        function updateToggleIcons(currentTheme) {
            if (currentTheme === "light") {
                if (sunIcon) sunIcon.style.display = "none";
                if (moonIcon) moonIcon.style.display = "inline-block";
                themeToggleBtn.setAttribute("title", "Переключить на темную тему");
            } else {
                if (sunIcon) sunIcon.style.display = "inline-block";
                if (moonIcon) moonIcon.style.display = "none";
                themeToggleBtn.setAttribute("title", "Переключить на светлую тему");
            }
        }

        const currentTheme = document.documentElement.getAttribute("data-theme") || "light";
        updateToggleIcons(currentTheme);

        themeToggleBtn.addEventListener("click", () => {
            const activeTheme = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", activeTheme);
            localStorage.setItem("nopaste-theme", activeTheme);
            updateToggleIcons(activeTheme);
        });
    }
    </script>
</body>
</html>
