<!DOCTYPE html>
<html lang="{{ lang|default('ru') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nopaste — {{ display_name }}</title>
    <meta name="description" content="{{ content_preview or ('Open paste ' ~ display_name ~ ' in Nopaste.') }}">
    <meta property="og:site_name" content="Nopaste">
    <meta property="og:type" content="article">
    <meta property="og:title" content="Nopaste — {{ display_name }}">
    <meta property="og:description" content="{{ content_preview or ('Open paste ' ~ display_name ~ ' in Nopaste.') }}">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="article:published_time" content="{{ created_at }}">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0e1012;
            color: #e2e2e6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            padding: 24px 16px;
            max-width: 960px;
            margin: 0 auto;
        }
        article { margin-bottom: 32px; }
        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #8ab4f8;
            margin-bottom: 8px;
        }
        .iv-meta {
            font-size: 0.8125rem;
            color: #9ba3af;
            margin-bottom: 20px;
        }
        .iv-meta span + span::before {
            content: " · ";
        }
        pre {
            background: #1a1c1e;
            border: 1px solid #33373b;
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            font-family: "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace;
            font-size: 0.875rem;
            line-height: 1.65;
            color: #e2e8f0;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
            tab-size: 4;
        }
        .iv-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .iv-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.15s, border-color 0.15s;
        }
        .iv-btn-primary {
            background: #8ab4f8;
            color: #000;
        }
        .iv-btn-primary:hover {
            background: #aecbfa;
        }
        .iv-btn-secondary {
            background: #212427;
            color: #e2e2e6;
            border: 1px solid #33373b;
        }
        .iv-btn-secondary:hover {
            background: #2d3135;
            border-color: #44494e;
        }
        .iv-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <article>
        <h1>Paste {{ display_name }}</h1>
        <div class="iv-meta">
            <span>{{ line_count }} {{ t('paste.lines', n=line_count).split(' ')[-1] if t is defined else 'lines' }}</span>
            {% if created_at %}<span>{{ created_at }}</span>{% endif %}
        </div>
        <pre>{{ content }}</pre>
    </article>
    <div class="iv-actions">
        <a href="{{ view_url }}" class="iv-btn iv-btn-primary">{{ t('iv.view') if t is defined else 'View' }}</a>
    </div>
</body>
</html>
