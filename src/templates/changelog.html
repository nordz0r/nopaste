{% extends base_template %}

{% block content %}
<div class="changelog-card">
    <div class="changelog-card-header">
        <h1>Nopaste Changelog</h1>
        <p>Permanent link: <code>/nopaste_changelog</code></p>
    </div>
    <div class="changelog-body">
        <div id="changelog-markdown" class="markdown-body"></div>
    </div>
</div>

<textarea id="changelog-raw" class="sr-only" aria-hidden="true" readonly>{{ changelog_markdown }}</textarea>
<script src="/static/js/marked.min.js?v={{ asset_version }}"></script>
<script nonce="{{ request.state.csp_nonce }}">
(function () {
    const rawField = document.getElementById("changelog-raw");
    const target = document.getElementById("changelog-markdown");
    if (!rawField || !target || !window.marked) return;
    const renderer = new marked.Renderer();
    const defaultTable = renderer.table.bind(renderer);
    renderer.table = function(header, body) {
        const rendered = typeof header === "object" && header !== null
            ? defaultTable(header)
            : defaultTable(header, body);
        return `<div class="table-wrap">${rendered}</div>`;
    };
    marked.setOptions({ renderer, gfm: true, breaks: false });
    target.innerHTML = marked.parse(rawField.value);
    if (window.nopasteAttachTableEnhancements) {
        window.nopasteAttachTableEnhancements(target);
    }
})();
</script>
{% endblock %}
