---
# Published image stack (SQLite by default).
# Postgres: DATABASE_URL=postgresql+psycopg://nopaste:nopaste@postgres:5432/nopaste \
#           docker compose --profile postgres up -d
services:
  nopaste-app:
    image: nordz0r/nopaste:main
    pull_policy: always
    container_name: nopaste
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/data/pastes.db}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      PASTE_ENCRYPTION_KEY: ${PASTE_ENCRYPTION_KEY:-}
      COOKIE_SIGNING_SECRET: ${COOKIE_SIGNING_SECRET:-local-development-cookie-secret}
      SHRINK_URL: ${SHRINK_URL:-}
      SHRINK_TOKEN: ${SHRINK_TOKEN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      UI_DESIGN: ${UI_DESIGN:-default}
    volumes:
      - nopaste_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    container_name: nopaste-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nopaste}
      POSTGRES_USER: ${POSTGRES_USER:-nopaste}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nopaste}
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - nopaste_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  nopaste_data:
  nopaste_pgdata:
