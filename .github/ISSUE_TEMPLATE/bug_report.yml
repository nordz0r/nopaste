name: Bug report
description: Something is broken
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected vs actual behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.13.1 / commit SHA / image tag"
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a paste with …
        2. Open /raw/…
    validations:
      required: true
