name: Ruff format

on:
  push:
    branches:
      - feat/dynamic-llms-txt-webmcp-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/dynamic-llms-txt-webmcp-v2
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Format source
        run: uv run ruff format src/llms_txt.py src/main.py

      - name: Commit formatted source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ruff-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/llms_txt.py src/main.py .github/workflows/ruff-format.yml
          git commit -m "style: ruff format llms_txt and main"
          git push origin HEAD:feat/dynamic-llms-txt-webmcp-v2

