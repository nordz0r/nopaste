name: Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dockerhub.yml"
      - ".github/workflows/release.yml"
      - "CHANGELOG.md"
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.local.yml"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: nordz0r/nopaste
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semantic-release.outputs.released }}
      tag: ${{ steps.semantic-release.outputs.tag }}
      version: ${{ steps.semantic-release.outputs.version }}
      commit_sha: ${{ steps.semantic-release.outputs.commit_sha }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release commit, tag, and GitHub Release
        id: semantic-release
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: github-actions[bot]
          git_committer_email: actions@users.noreply.github.com

      - name: Extract version components
        if: ${{ steps.semantic-release.outputs.released == 'true' }}
        id: version
        run: |
          VERSION="${{ steps.semantic-release.outputs.version }}"
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      - name: Enrich GitHub Release notes
        if: ${{ steps.semantic-release.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semantic-release.outputs.tag }}
          VERSION: ${{ steps.semantic-release.outputs.version }}
        run: |
          body="$(gh release view "$TAG" --json body -q .body)"
          {
            echo "$body"
            echo
            echo "---"
            echo
            echo "## Install"
            echo
            echo "```bash"
            echo "docker pull nordz0r/nopaste:${VERSION}"
            echo "docker pull ghcr.io/${{ github.repository }}:${VERSION}"
            echo "docker compose up -d"
            echo "```"
            echo
            echo "Image tags: \`${VERSION}\`, \`${TAG}\`, \`latest\`."
          } > /tmp/release-body.md
          gh release edit "$TAG" --notes-file /tmp/release-body.md

  publish-release-image:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          build-args: |
            APP_VERSION=${{ needs.release.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.release.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ needs.release.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ needs.release.outputs.major }}.${{ needs.release.outputs.minor }}
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.GHCR_IMAGE }}:${{ needs.release.outputs.version }}
            ${{ env.GHCR_IMAGE }}:${{ needs.release.outputs.tag }}
            ${{ env.GHCR_IMAGE }}:${{ needs.release.outputs.major }}.${{ needs.release.outputs.minor }}
            ${{ env.GHCR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
