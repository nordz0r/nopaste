name: apply-telegram-share-canonical
# bump: trigger-apply-4
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-telegram-share-canonical.yml"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/telegram-share-canonical-url
      - name: Apply patches, commit, cleanup
        run: |
          set -euo pipefail
          patch -p1 --forward --batch -i patches/telegram-share-paste.patch
          patch -p1 --forward --batch -i patches/telegram-share-tests.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-telegram-share-canonical.yml
          rm -f tmp-push-files-smoke.txt
          rm -rf patches
          git add src/templates/paste.html tests/test_main.py
          git add -u .github/workflows/apply-telegram-share-canonical.yml || true
          git add -u tmp-push-files-smoke.txt || true
          git add -u patches || true
          git status
          git commit -m "fix: Telegram share always uses canonical paste URL"
          git push origin HEAD:fix/telegram-share-canonical-url
          git fetch origin main
          git checkout -B main origin/main
          if [ -f .github/workflows/apply-telegram-share-canonical.yml ]; then
            rm -f .github/workflows/apply-telegram-share-canonical.yml
            git add -u .github/workflows/apply-telegram-share-canonical.yml
            git commit -m "chore: remove temporary telegram-share apply workflow"
            git push origin main
          fi
