name: Docker Hub Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - ".dockerignore"
      - ".github/workflows/dockerhub.yml"
      - ".github/workflows/release.yml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.local.yml"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - "uv.lock"
  pull_request:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/dockerhub.yml"
      - ".github/workflows/release.yml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.local.yml"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: nordz0r/nopaste
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: false
          tags: nopaste:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read app version
        id: ver
        run: |
          VERSION="$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
